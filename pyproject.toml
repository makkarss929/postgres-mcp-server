[project]
name = "postgres-mcp-server"
version = "0.1.0"
description = "A read-only Model Context Protocol (MCP) server that lets LLM agents explore and query PostgreSQL safely."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tarun Makkar", email = "makkarss929@gmail.com" }]
dependencies = [
  "mcp[cli]>=1.2.0",
  "psycopg[binary,pool]>=3.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
postgres-mcp = "postgres_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postgres_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
